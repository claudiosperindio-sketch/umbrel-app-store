category: automation
name: Attento!
version: "1.1.3"
tagline: Gli avvisi delle tue telecamere ONVIF e RTSP, sul telefono
icon: https://attento.online/assets/umbrel/icon.svg
description: >-
  Attento! sorveglia le telecamere di casa e ti avvisa sul telefono quando qualcuno o qualcosa si muove dove hai deciso tu: il cancello, il cortile, la stalla. Ogni avviso arriva con il suo video; con Attento! Pro ti dice anche se è una persona, un veicolo o un animale.


  📷 LE TELECAMERE


  Il requisito: telecamere ONVIF o RTSP, cioè che mandano il video sulla rete di casa senza passare dal cloud. Attento! le trova da solo e funziona con queste marche: Tapo, VIGI e Mercusys (TP-Link), Reolink, Hikvision, HiLook, Annke, Ezviz, Dahua, Amcrest, Lorex, Imou, Uniview, Hanwha Wisenet, Axis, Bosch, Vivotek, Milesight, Foscam, D-Link, Eufy, ICSee e XMeye, CamHi, Vstarcam, Yoosee, Tuya e Smart Life. Alle altre telecamere ONVIF chiede da solo dov'è il video.


  Alcune escono di fabbrica con l'RTSP spento (Reolink, Ezviz, Eufy) o con l'ONVIF spento (Tuya, Smart Life): si accende nella loro app. Non funzionano le telecamere solo cloud (Ring, Nest, Arlo, Blink, Xiaomi) né quelle a batteria che non tengono un video continuo, come le Tapo e le Reolink a batteria.


  Questa app è il programma di casa di Attento!, lo stesso che gira su Mac e Windows: a sorvegliare è Umbrel, e nessun computer deve restare acceso. Trova da solo le telecamere sulla rete di casa e tiene le loro password su Umbrel, cifrate con la sua chiave: non vanno mai al server di Attento!.


  🖥️ LA CENTRALE


  Apri Attento! da Umbrel su un computer, un tablet o la TV di casa: tutte le telecamere dal vivo, gli avvisi con il loro video e l'allarme, come nella Centrale del Mac. Con la Modalità TV, la telecamera che si muove va in primo piano.


  ⚠️ Serve un account Attento! (c'è il piano gratuito con una telecamera, su attento.online) e l'app Attento! sul telefono. Se Attento! è acceso anche su un Mac o un PC di casa, chiudilo prima di collegare Umbrel: due programmi di casa sulle stesse telecamere si disturbano.


  🛠️ COME SI COLLEGA


  - Sul telefono apri Attento! → Impostazioni → Collega un computer e tocca Mostra codice per il computer.


  - Apri Attento! su Umbrel e scrivi il codice di 6 caratteri.


  - Per ogni telecamera trovata scrivi nome utente e password, tocca Salva, poi Prova collegamento.
releaseNotes: >-
  Telecamere di ogni marca: Attento! è stato provato con 36 telecamere simulate di 22 marche e ora si collega da solo anche a quelle che prima davano errore.


  - Dahua, Amcrest e Imou ora usano il flusso leggero: prima prendevano quello pesante, in H.265.


  - Hikvision di fabbrica, TP-Link VIGI, Tuya e le telecamere con un utente ONVIF a parte (Axis, Hikvision): niente più «password non accettata» con la password giusta.


  - ICSee e XMeye (Xiongmai) ed Eufy con RTSP/NAS acceso ora funzionano. La password che le ICSee mettono nel percorso del video resta su Umbrel.


  - Hikvision con «RTSP Digest Algorithm» su SHA-256: Attento! non prova la password e ti dice dove mettere MD5.


  - Una password sbagliata costa al massimo un accesso sbagliato sulla telecamera, così Hikvision e Dahua non si bloccano.


  Le Reolink appena installate hanno RTSP e ONVIF spenti: accendili nell'app Reolink (impostazioni della telecamera → Rete → Avanzate → Impostazioni porte).


  Dalla 1.1.2: il nome utente che salvi per una telecamera resta quello che hai scritto, anche quando è «admin». Se una telecamera non si vede, salva una volta il suo nome utente e la password (l'ingranaggio della Centrale → Telecamere → Salva).
